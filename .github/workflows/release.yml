name: Release

# Publishing is fully automated up to the final human gate: merge a version bump to main, push the
# matching tag, and this workflow tests, packs, stages the release on npm, and creates the GitHub
# release. The version does NOT go live until a maintainer approves it on npmjs.com (or with
# `npm stage approve`), which requires 2FA. See CONTRIBUTING.md, "Releasing".
#
# npm authentication uses trusted publishing (OIDC): there is no token in this repo. The package's
# npm settings must list this workflow as a trusted publisher, with direct publishing disabled so
# that CI can only stage.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Test, stage on npm, create GitHub release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "Releasing $PKG_VERSION"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Lint and format check
        run: bun run lint

      - name: Run tests
        run: bun test

      - name: Run typecheck
        run: bun run typecheck

      - name: Run isolated integration tests
        run: bun run test:integration

      # npm >= 11.15.0 is required for staged publishing; Node 24 ships a recent npm and the
      # explicit upgrade guards against an older bundled copy on the runner image.
      - name: Install Node for npm publish
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm
        run: npm install -g npm@latest && npm --version

      # Only used as the GitHub release asset. `npm stage publish` packs the working directory
      # itself and takes no tarball argument, so this tarball is not the one that gets staged;
      # both are built from the same commit by the same npm version.
      - name: Build npm tarball
        run: npm pack

      # Re-pushing a tag whose version is already live is a no-op. Re-pushing one that is still
      # awaiting approval is not guarded: staged and live versions share a version index, so
      # `npm stage publish` fails, and failing loudly beats silently skipping a real release.
      - name: Stage npm release with provenance
        run: |
          PKG_NAME="$(node -p "require('./package.json').name")"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if npm view "$PKG_NAME@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "$PKG_NAME@$PKG_VERSION is already live on npm; nothing to stage."
            exit 0
          fi
          npm stage publish --provenance --access public

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.tgz"
          generate_release_notes: true

      - name: Summarize the approval step
        run: |
          PKG_NAME="$(node -p "require('./package.json').name")"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          {
            echo "## $PKG_NAME@$PKG_VERSION is staged, not live"
            echo
            echo "It is not installable until a maintainer approves it with 2FA:"
            echo
            echo "- npmjs.com -> the package -> **Staged Packages** -> Approve, or"
            echo "- \`npm stage list\` then \`npm stage approve <stage-id>\`"
          } >> "$GITHUB_STEP_SUMMARY"
