name: Release

# Publishing is fully automated: merge a version bump to main, push the matching tag, and this
# workflow tests, packs, publishes to npm with provenance, and creates the GitHub release.
#
# npm authentication uses trusted publishing (OIDC): there is no token in this repo. The package's
# npm settings must list this workflow as a trusted publisher (see CONTRIBUTING.md, "Releasing").
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Test, publish to npm, create GitHub release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "Releasing $PKG_VERSION"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Lint and format check
        run: bun run lint

      - name: Run tests
        run: bun test

      - name: Run typecheck
        run: bun run typecheck

      - name: Run isolated integration tests
        run: bun run test:integration

      # npm >= 11.5.1 is required for trusted publishing; Node 24 ships a recent npm and the
      # explicit upgrade guards against an older bundled copy on the runner image.
      - name: Install Node for npm publish
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm
        run: npm install -g npm@latest && npm --version

      - name: Build npm tarball
        run: npm pack

      - name: Publish to npm with provenance
        run: |
          PKG_NAME="$(node -p "require('./package.json').name")"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if npm view "$PKG_NAME@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "$PKG_NAME@$PKG_VERSION is already on npm; skipping publish (re-run of an existing tag)."
            exit 0
          fi
          npm publish ./*.tgz --provenance --access public

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.tgz"
          generate_release_notes: true
