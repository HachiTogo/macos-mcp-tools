name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      # bin/EventKitCLI is no longer committed; every checkout, including this one, builds it.
      # macos-latest ships swiftc, and build:swift verifies the signature and architecture it
      # produced. The tests below expect the binary to exist.
      - name: Build EventKit binary
        run: bun run build:swift

      - name: Lint and format check
        run: bun run lint

      - name: Run tests
        run: bun test

      - name: Run typecheck
        run: bun run typecheck

      - name: Run isolated integration tests
        run: bun run test:integration
