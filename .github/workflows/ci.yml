name: CI

on:
  push:
    branches: [main]
  # No base-branch filter. A stacked PR targets the slice below it, not main, so `branches: [main]`
  # skipped it entirely -- the runs those PRs did get came from `gh stack submit` creating them
  # against main and then retargeting, which is tooling accident rather than coverage.
  pull_request:

jobs:
  test:
    name: Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      # The package manifest test shells out to `npm pack`, and release.yml packs and stages with
      # this exact npm. Pinning both to the same version is what makes a green PR mean the release
      # will pack the same way; a floating `@latest` is what broke the v0.6.0 release.
      - name: Install pinned Node and npm
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pinned npm
        run: npm install -g npm@12.0.2 && npm --version

      # bin/EventKitCLI is no longer committed; every checkout, including this one, builds it.
      # macos-latest ships swiftc, and build:swift verifies the signature and architecture it
      # produced. The tests below expect the binary to exist.
      - name: Build EventKit binary
        run: bun run build:swift

      - name: Lint and format check
        run: bun run lint

      - name: Run tests
        run: bun test

      - name: Run typecheck
        run: bun run typecheck

      - name: Run isolated integration tests
        run: bun run test:integration
